name = "sightread"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# TAVILY_API_KEY is required for /api/search web search.
# Set it as a secret (never commit the value):
#   npx wrangler pages secret put TAVILY_API_KEY --project-name=sightread
#
# GEMINI_API_KEY (optional) powers Tier-1 /api/vision/scene without shipping
# keys in the Capacitor/web client. If unset, clients may send BYOK via
# Authorization: Bearer <key>.
#   npx wrangler pages secret put GEMINI_API_KEY --project-name=sightread
#
# NVIDIA requests are proxied with the user's own API key in the Authorization header;
# no server-side NVIDIA secret is needed.
