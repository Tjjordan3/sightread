name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/Sightread
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/Sightread/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
      # Existing eslint debt (set-state-in-effect / unused vars) — report but do not block.
      - name: Lint (non-blocking)
        continue-on-error: true
        run: npm run lint
